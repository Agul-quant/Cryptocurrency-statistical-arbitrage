[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-stat-arb-course"
version = "0.1.0"
description = "Reproducible course research on crypto momentum and reversal"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "requests", "pyarrow", "matplotlib", "statsmodels", "scipy", "reportlab", "nbformat", "nbclient", "nbconvert", "ipykernel"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
crypto-stat-arb = "crypto_stat_arb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

