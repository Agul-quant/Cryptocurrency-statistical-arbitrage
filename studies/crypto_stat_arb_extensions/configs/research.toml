[data]
symbols = ["BTCUSDT", "ETHUSDT", "LTCUSDT", "ADAUSDT", "LINKUSDT", "DOGEUSDT", "DOTUSDT", "SOLUSDT"]
start = "2021-10-01"
history_end = "2026-01-01"
holdout_end = "2026-10-01"
interval = "1h"

[research]
primary_cost_bps = 20.0
primary_execution_lag = 1
cost_scenarios_bps = [0.0, 5.0, 10.0, 15.0, 20.0, 40.0]
delay_scenario_lag = 2
lookbacks_days = [14, 28]
rebalance_hours = [24, 168]
cross_momentum_buffers_l1 = [0.0, 0.25]
schedule_anchor_utc = "2022-01-03T00:00:00+00:00"
selection_rule = "Highest defined 2024 net daily Sharpe at 20 bps per tuned family; ties lower turnover then strategy ID"

[factor]
benchmark = "BTCUSDT"
formation_days = 90
beta_days = 30
calibration_days = 60
formation_lag_days = 1
beta_min = 0.1
beta_max = 5.0
sigma_min = 0.00000001
adf_regression = "c"
adf_maxlag = 3
adf_autolag = "AIC"
holm_alpha = 0.05
half_life_min_days = 1.0
half_life_max_days = 20.0
entry_z = 2.0
exit_z = 0.5
stop_z = 4.0
max_holding_days = 20
monthly_reset_to_cash = true
same_day_reentry = false

[diagnostics]
ic_lookbacks_hours = [1, 4, 12, 24, 72, 168, 336, 672]
ic_forward_hours = [1, 24, 168]
bootstrap_replicates = 4000
bootstrap_block_days = 28
bootstrap_seed = 20261006
holm_alpha = 0.05
regime_filters_trade = false
regime_volume_prior_days = 7
regime_volatility_days = 30
regime_cutoff = "2022-2023 development median"

[splits.development]
start = "2022-01-01"
end = "2024-01-01"

[splits.validation]
start = "2024-01-01"
end = "2025-01-01"

[splits.retrospective]
start = "2025-01-01"
end = "2026-01-01"

[splits.holdout]
start = "2026-01-01"
end = "2026-10-01"
